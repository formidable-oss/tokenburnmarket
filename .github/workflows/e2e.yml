name: e2e

on: [push, pull_request]

# The smoke suite renders real pages, so it needs a real database. Each run
# starts its own throwaway one, so forks and clones run the suite too.
jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      # Sign-in is never exercised here. Auth.js still wants a secret to boot.
      AUTH_SECRET: ci-not-a-real-secret-only-used-to-boot-the-app
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/test-database
      - run: pnpm --filter @tokenburnmarket/web exec playwright install --with-deps chromium
      - run: pnpm build

      - name: Start the built app
        run: |
          pnpm --filter @tokenburnmarket/web start &
          npx --yes wait-on http://localhost:3000/docs --timeout 90000

      - run: pnpm --filter @tokenburnmarket/web e2e

      # The signed-in journey uses development sign-in, so it starts its own dev
      # server and owns one throwaway account in the test database.
      - run: pnpm --filter @tokenburnmarket/web e2e:setup

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
